<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 Encoder Decoder - Weblixa</title>
<meta name="description" content="Encode and decode text using Base64 with Weblixa Base64 Encoder Decoder.">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #f5f7fb; color: #1f2937; min-height: 100vh; }
header { background: #ffffff; border-bottom: 1px solid #e5e7eb; padding: 18px 20px; }
.header-inner { max-width: 1100px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.logo { text-decoration: none; color: #111827; font-size: 26px; font-weight: 800; display: flex; align-items: center; }
.logo svg { width: 180px; height: 52px; display: block; }
.back-link { text-decoration: none; color: #2563eb; font-weight: 600; }
main { max-width: 1000px; margin: 50px auto; padding: 0 20px; }
.tool-header { text-align: center; margin-bottom: 30px; }
.tool-header h1 { font-size: 38px; color: #111827; margin-bottom: 10px; }
.tool-header h1 span { color: #2563eb; }
.tool-header p { color: #6b7280; font-size: 16px; }
.tool-box { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 25px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05); }
.label { display: block; margin-bottom: 8px; font-weight: 700; color: #374151; }
textarea { width: 100%; min-height: 220px; resize: vertical; border: 2px solid #e5e7eb; border-radius: 12px; padding: 16px; font-size: 16px; line-height: 1.6; outline: none; font-family: Consolas, Monaco, monospace; }
textarea:focus { border-color: #2563eb; }
.output { margin-top: 25px; }
.buttons { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
button { border: none; border-radius: 8px; padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer; color: #ffffff; background: #2563eb; }
button:hover { opacity: 0.9; }
.decode-btn { background: #16a34a; }
.copy-btn { background: #374151; }
.clear-btn { background: #ef4444; }
.info-box { margin-top: 25px; padding: 18px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; color: #1e40af; line-height: 1.6; }
footer { text-align: center; padding: 30px 20px; color: #6b7280; font-size: 14px; }
@media (max-width: 600px) {
  .header-inner { flex-direction: column; }
  .tool-header h1 { font-size: 30px; }
  .tool-box { padding: 18px; }
  textarea { min-height: 200px; }
  .buttons { flex-direction: column; }
  button { width: 100%; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="../../index.html" class="logo">
      <svg width="180" height="52" viewBox="0 0 180 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="weblixaGradient" x1="4" y1="4" x2="44" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#2563EB"/>
            <stop offset="0.5" stop-color="#7C3AED"/>
            <stop offset="1" stop-color="#06B6D4"/>
          </linearGradient>
        </defs>
        <path d="M6 9L15 38L25 14L35 38L44 9" stroke="url(#weblixaGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="58" y="35" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#102A56">Weblixa</text>
      </svg>
    </a>
    <a href="../../index.html" class="back-link">← Back to Home</a>
  </div>
</header>

<main>
  <div class="tool-header">
    <h1>Base64 Encoder / <span>Decoder</span></h1>
    <p>Encode text to Base64 or decode Base64 back to text.</p>
  </div>

  <div class="tool-box">
    <label class="label" for="inputText">Input</label>
    <textarea id="inputText" placeholder="Enter text or Base64 data here..."></textarea>

    <div class="buttons">
      <button id="encodeBtn">Encode to Base64</button>
      <button class="decode-btn" id="decodeBtn">Decode Base64</button>
      <button class="clear-btn" id="clearBtn">Clear</button>
    </div>

    <div class="output">
      <label class="label" for="outputText">Result</label>
      <textarea id="outputText" readonly placeholder="Your result will appear here..."></textarea>

      <div class="buttons">
        <button class="copy-btn" id="copyBtn">Copy Result</button>
      </div>
    </div>

    <div class="info-box" id="status">Enter your text and choose Encode or Decode.</div>
  </div>
</main>

<footer>© 2026 Weblixa. All rights reserved.</footer>

<script>
const inputText = document.getElementById("inputText");
const outputText = document.getElementById("outputText");
const encodeBtn = document.getElementById("encodeBtn");
const decodeBtn = document.getElementById("decodeBtn");
const copyBtn = document.getElementById("copyBtn");
const clearBtn = document.getElementById("clearBtn");
const statusBox = document.getElementById("status");

// UTF-8 text → Base64
function encodeBase64(text) {
  const bytes = new TextEncoder().encode(text);
  let binary = "";
  const chunkSize = 0x8000;

  for (let i = 0; i < bytes.length; i += chunkSize) {
    const chunk = bytes.subarray(i, i + chunkSize);
    binary += String.fromCharCode(...chunk);
  }

  return btoa(binary);
}

// Base64 → UTF-8 text
function decodeBase64(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);

  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }

  return new TextDecoder().decode(bytes);
}

// Encode
encodeBtn.addEventListener("click", function () {
  const text = inputText.value;

  if (!text) {
    statusBox.textContent = "Please enter some text first.";
    return;
  }

  try {
    outputText.value = encodeBase64(text);
    statusBox.textContent = "Text encoded to Base64 successfully.";
  } catch (error) {
    outputText.value = "";
    statusBox.textContent = "Unable to encode the text.";
  }
});

// Decode
decodeBtn.addEventListener("click", function () {
  const base64 = inputText.value.trim();

  if (!base64) {
    statusBox.textContent = "Please enter Base64 data first.";
    return;
  }

  try {
    outputText.value = decodeBase64(base64);
    statusBox.textContent = "Base64 decoded successfully.";
  } catch (error) {
    outputText.value = "";
    statusBox.textContent = "Invalid Base64 data.";
  }
});

// Copy result
copyBtn.addEventListener("click", async function () {
  const result = outputText.value;

  if (!result) {
    statusBox.textContent = "There is no result to copy.";
    return;
  }

  try {
    await navigator.clipboard.writeText(result);
    statusBox.textContent = "Result copied successfully.";
  } catch (error) {
    outputText.select();
    document.execCommand("copy");
    statusBox.textContent = "Result copied successfully.";
  }
});

// Clear
clearBtn.addEventListener("click", function () {
  inputText.value = "";
  outputText.value = "";
  statusBox.textContent = "Base64 tool cleared.";
  inputText.focus();
});
</script>

</body>
</html>
