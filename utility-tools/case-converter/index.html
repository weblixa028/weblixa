<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Case Converter - Weblixa</title>
<meta name="description" content="Convert text to uppercase, lowercase, title case, sentence case and more with Weblixa.">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #f5f7fb; color: #1f2937; min-height: 100vh; }
header { background: #ffffff; border-bottom: 1px solid #e5e7eb; padding: 18px 20px; }
.header-inner { max-width: 1100px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.logo { text-decoration: none; color: #111827; font-size: 26px; font-weight: 800; display: flex; align-items: center; }
.logo svg { width: 180px; height: 52px; display: block; }
.back-link { text-decoration: none; color: #2563eb; font-weight: 600; }
main { max-width: 1000px; margin: 50px auto; padding: 0 20px; }
.tool-header { text-align: center; margin-bottom: 30px; }
.tool-header h1 { font-size: 38px; color: #111827; margin-bottom: 10px; }
.tool-header h1 span { color: #2563eb; }
.tool-header p { color: #6b7280; font-size: 16px; }
.tool-box { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 25px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05); }
textarea { width: 100%; min-height: 320px; resize: vertical; border: 2px solid #e5e7eb; border-radius: 12px; padding: 18px; font-size: 17px; line-height: 1.7; outline: none; font-family: Arial, Helvetica, sans-serif; }
textarea:focus { border-color: #2563eb; }
.buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
button { border: none; border-radius: 8px; padding: 12px 15px; font-size: 15px; font-weight: 600; cursor: pointer; background: #2563eb; color: #ffffff; transition: 0.2s; }
button:hover { opacity: 0.9; transform: translateY(-1px); }
.secondary { background: #374151; }
.danger { background: #ef4444; }
.info-box { margin-top: 25px; padding: 18px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; color: #1e40af; line-height: 1.6; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 25px; }
.stat { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px; text-align: center; }
.stat h3 { color: #6b7280; font-size: 14px; margin-bottom: 8px; }
.stat p { color: #111827; font-size: 25px; font-weight: 800; }
footer { text-align: center; padding: 30px 20px; color: #6b7280; font-size: 14px; }
@media (max-width: 750px) {
  .tool-header h1 { font-size: 32px; }
  .buttons { grid-template-columns: repeat(2, 1fr); }
  .stats { grid-template-columns: 1fr; }
}
@media (max-width: 500px) {
  .header-inner { flex-direction: column; }
  .tool-box { padding: 18px; }
  textarea { min-height: 260px; }
  .buttons { grid-template-columns: 1fr; }
  .tool-header h1 { font-size: 28px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="../../index.html" class="logo">
      <svg width="180" height="52" viewBox="0 0 180 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="weblixaGradient" x1="4" y1="4" x2="44" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#2563EB"/>
            <stop offset="0.5" stop-color="#7C3AED"/>
            <stop offset="1" stop-color="#06B6D4"/>
          </linearGradient>
        </defs>
        <path d="M6 9L15 38L25 14L35 38L44 9" stroke="url(#weblixaGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="58" y="35" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#102A56">Weblixa</text>
      </svg>
    </a>
    <a href="../../index.html" class="back-link">← Back to Home</a>
  </div>
</header>

<main>
  <div class="tool-header">
    <h1>Text Case <span>Converter</span></h1>
    <p>Convert your text to different cases instantly.</p>
  </div>

  <div class="tool-box">
    <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>

    <div class="buttons">
      <button id="upperBtn">UPPERCASE</button>
      <button id="lowerBtn">lowercase</button>
      <button id="titleBtn">Title Case</button>
      <button id="sentenceBtn">Sentence case</button>
      <button id="toggleBtn">tOGGLE cASE</button>
      <button class="secondary" id="copyBtn">Copy Text</button>
      <button class="danger" id="clearBtn">Clear</button>
    </div>

    <div class="stats">
      <div class="stat">
        <h3>Characters</h3>
        <p id="characterCount">0</p>
      </div>
      <div class="stat">
        <h3>Words</h3>
        <p id="wordCount">0</p>
      </div>
      <div class="stat">
        <h3>Lines</h3>
        <p id="lineCount">0</p>
      </div>
    </div>

    <div class="info-box" id="status">Enter text and choose a case conversion.</div>
  </div>
</main>

<footer>© 2026 Weblixa. All rights reserved.</footer>

<script>
const textInput = document.getElementById("textInput");
const characterCount = document.getElementById("characterCount");
const wordCount = document.getElementById("wordCount");
const lineCount = document.getElementById("lineCount");
const statusBox = document.getElementById("status");

function updateStats() {
  const text = textInput.value;

  characterCount.textContent = text.length;

  const trimmedText = text.trim();
  wordCount.textContent = trimmedText === "" ? "0" : trimmedText.split(/\s+/).length;

  lineCount.textContent = text === "" ? "0" : text.split("\n").length;
}

function setText(newText, message) {
  textInput.value = newText;
  updateStats();
  statusBox.textContent = message;
  textInput.focus();
}

// UPPERCASE
document.getElementById("upperBtn").addEventListener("click", function () {
  setText(textInput.value.toUpperCase(), "Text converted to uppercase.");
});

// lowercase
document.getElementById("lowerBtn").addEventListener("click", function () {
  setText(textInput.value.toLowerCase(), "Text converted to lowercase.");
});

// Title Case
document.getElementById("titleBtn").addEventListener("click", function () {
  const text = textInput.value.toLowerCase();
  const result = text.replace(/\b\w/g, function (char) {
    return char.toUpperCase();
  });
  setText(result, "Text converted to title case.");
});

// Sentence case
document.getElementById("sentenceBtn").addEventListener("click", function () {
  const text = textInput.value.toLowerCase();
  const result = text.replace(/(^\s*|[.!?]\s+)([a-z])/g, function (match, prefix, letter) {
    return prefix + letter.toUpperCase();
  });
  setText(result, "Text converted to sentence case.");
});

// tOGGLE cASE
document.getElementById("toggleBtn").addEventListener("click", function () {
  const text = textInput.value;
  let result = "";

  for (let i = 0; i < text.length; i++) {
    const char = text[i];

    if (char === char.toUpperCase() && char !== char.toLowerCase()) {
      result += char.toLowerCase();
    } else if (char === char.toLowerCase() && char !== char.toUpperCase()) {
      result += char.toUpperCase();
    } else {
      result += char;
    }
  }

  setText(result, "Text case toggled successfully.");
});

// Copy
document.getElementById("copyBtn").addEventListener("click", async function () {
  const text = textInput.value;

  if (!text) {
    statusBox.textContent = "There is no text to copy.";
    return;
  }

  try {
    await navigator.clipboard.writeText(text);
    statusBox.textContent = "Text copied successfully.";
  } catch (error) {
    textInput.select();
    document.execCommand("copy");
    statusBox.textContent = "Text copied successfully.";
  }
});

// Clear
document.getElementById("clearBtn").addEventListener("click", function () {
  textInput.value = "";
  updateStats();
  statusBox.textContent = "Text cleared successfully.";
  textInput.focus();
});

// Live statistics
textInput.addEventListener("input", updateStats);

updateStats();
</script>

</body>
</html>
